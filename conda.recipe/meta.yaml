{% set version = "5.5.0" %}

package:
  name: fplll
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  script: >-
    cmake -S "${SRC_DIR}" -B build -G Ninja
    -DCMAKE_BUILD_TYPE=Release
    -DCMAKE_INSTALL_PREFIX="${PREFIX}"
    -DCMAKE_INSTALL_LIBDIR=lib
    -DBUILD_TESTING=OFF
    && cmake --build build --parallel "${CPU_COUNT}"
    && cmake --install build

requirements:
  build:
    - {{ compiler('cxx') }}
    - cmake >=3.20
    - ninja
  host:
    - gmp
    - mpfr
  run:
    - gmp
    - mpfr

test:
  requires:
    - pkg-config
  commands:
    - fplll --version
    - pkg-config --exists fplll
    - pkg-config --modversion fplll

about:
  home: https://github.com/fplll/fplll
  license: LGPL-2.1-or-later
  license_file: COPYING
  summary: Lattice algorithms with floating-point computations
