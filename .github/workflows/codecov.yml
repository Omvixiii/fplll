name: Code Coverage

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codecov-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gcc-coverage:
    if: github.repository == 'fplll/fplll'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up build environment
        uses: ./.github/actions/setup-fplll
      - name: Configure, build, and test
        run: |
          cmake --preset debug -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_STANDARD=23 \
            -DFPLLL_MAX_PARALLEL_ENUM_DIM=20 -DCMAKE_CXX_FLAGS=--coverage \
            -DCMAKE_EXE_LINKER_FLAGS=--coverage -DCMAKE_SHARED_LINKER_FLAGS=--coverage
          cmake --build --preset debug
          ctest --preset debug
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Upload coverage
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
