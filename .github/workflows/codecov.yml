name: Code Coverage

on:
  push:
  pull_request:

jobs:
  gcc-coverage:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: dnf -y install gcc gcc-c++ ccache cmake ninja-build gmp-devel mpfr-devel qd-devel pkgconf-pkg-config
      - name: Configure, build, and test
        run: |
          cmake --preset gcc-coverage
          cmake --build --preset gcc-coverage --parallel 8
          ctest --test-dir build/gcc-coverage --output-on-failure
      - name: Upload coverage
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
