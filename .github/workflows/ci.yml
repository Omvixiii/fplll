name: CI

on:
  push:
    branches:
      - master
      - next/6.0
      - refactor/meson
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-clang:
    name: linux / clang-18
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev libmpfr-dev pkg-config clang-18
      - name: Install Meson (>= 1.8)
        # The distro package is older than the project floor, so use PyPI.
        run: |
          pipx install "meson>=1.8"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version
      - name: Configure
        run: meson setup build --buildtype=release -Dwarning_level=3
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  linux-gcc14:
    name: linux / gcc-14 (container)
    runs-on: ubuntu-24.04
    container: gcc:14
    timeout-minutes: 30
    steps:
      - name: Bootstrap container
        run: |
          apt-get update
          apt-get install -y git ca-certificates python3 python3-venv
      - uses: actions/checkout@v4
      - name: Install dependencies and Meson (>= 1.8)
        run: |
          apt-get install -y ninja-build libgmp-dev libmpfr-dev pkg-config
          python3 -m venv /opt/meson
          /opt/meson/bin/pip install --upgrade pip "meson>=1.8"
          ln -sf /opt/meson/bin/meson /usr/local/bin/meson
          meson --version
      - name: Configure
        run: meson setup build --buildtype=release -Dwarning_level=3
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  macos:
    name: macos / appleclang
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ninja gmp mpfr pkg-config
      - name: Install Meson (>= 1.8)
        run: |
          brew install meson || true
          version="$(meson --version 2>/dev/null || true)"
          if [ -z "$version" ] || ! python3 -c 'import sys; parts = sys.argv[1].split("."); sys.exit(0 if (int(parts[0]), int(parts[1])) >= (1, 8) else 1)' "$version"; then
            echo "Homebrew Meson is unavailable or older than 1.8; installing with pipx"
            pipx install "meson>=1.8"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          meson --version
      - name: Configure
        run: meson setup build --buildtype=release -Dwarning_level=3
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  strict-warnings:
    # Advisory until the pre-existing warning baseline is cleaned up; make blocking once the core warning cleanup lands.
    name: strict warnings (advisory)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev libmpfr-dev pkg-config clang-18
      - name: Install Meson (>= 1.8)
        run: |
          pipx install "meson>=1.8"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version
      - name: Configure
        run: meson setup build --buildtype=debug -Dwarning_level=3 -Dwerror=true
      - name: Build
        run: meson compile -C build

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang-18
      CXX: clang++-18
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev libmpfr-dev pkg-config clang-18
      - name: Install Meson (>= 1.8)
        run: |
          pipx install "meson>=1.8"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version
      - name: Configure
        run: meson setup build-asan --buildtype=debug -Db_sanitize=address,undefined -Db_lundef=false
      - name: Build
        run: meson compile -C build-asan
      - name: Test
        # ASan roughly 5-10x slower; -t 5 raises the 300 s test budget.
        run: meson test -C build-asan --print-errorlogs -t 5

  library-types:
    name: library / ${{ matrix.default_library }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        default_library:
          - static
          - shared
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev libmpfr-dev pkg-config clang-18
      - name: Install Meson (>= 1.8)
        run: |
          pipx install "meson>=1.8"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version
      - name: Configure
        run: meson setup build --buildtype=release --default-library=${{ matrix.default_library }}
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  install-consumer:
    name: install, headers, consumer, ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev libmpfr-dev pkg-config clang-18
      - name: Install Meson (>= 1.8)
        run: |
          pipx install "meson>=1.8"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version
      - name: Configure
        run: meson setup build --buildtype=release --prefix="$PWD/_install"
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      - name: Install
        run: meson install -C build
      - name: Check install manifest
        run: >
          python3 scripts/check_install_manifest.py --prefix _install
          --forbid-installed-cpp --forbid-private-fragments
      - name: Check installed headers
        run: >
          python3 scripts/check_headers.py --include-dir _install/include
          --compiler clang++-18 --std c++23
      - name: Build and run consumer
        # pkg-config is the downstream interface: point it at the staged prefix.
        run: |
          export PKG_CONFIG_PATH="$PWD/_install/lib/pkgconfig"
          meson setup build-consumer tests/consumer --buildtype=release
          meson compile -C build-consumer
          LD_LIBRARY_PATH="$PWD/_install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ./build-consumer/consumer > /dev/null
      - name: Dump ABI symbols
        run: |
          library="$(find _install/lib -type f \( -name 'libfplll*.so*' -o -name 'libfplll*.dylib' \) ! -name '*.a' | head -1)"
          scripts/abi_dump.sh "$library" abi-symbols.txt
      - name: Upload ABI symbols
        uses: actions/upload-artifact@v4
        with:
          name: abi-symbols
          path: abi-symbols.txt
          if-no-files-found: error

  quality:
    name: format and static analysis
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev libmpfr-dev pkg-config \
            clang-18 clang-format-18 clang-tidy-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
      - name: Install Meson (>= 1.8)
        run: |
          pipx install "meson>=1.8"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version
      - name: Configure (debug, generated compile database)
        run: meson setup build --buildtype=debug
      - name: Check formatting
        run: meson compile -C build lint
      - name: clang-tidy (project sources, advisory)
        run: clang-tidy-18 -p build --quiet $(git ls-files 'fplll/*.cpp') || true

  benchmarks:
    name: benchmark smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev libmpfr-dev pkg-config clang-18
      - name: Install Meson (>= 1.8)
        run: |
          pipx install "meson>=1.8"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version
      - name: Configure
        run: meson setup build --buildtype=release -Dbenchmarks=true
      - name: Build
        run: meson compile -C build
      - name: Run benchmark smoke test
        run: ./build/bench/fplll_bench --dims 20,30 --bits 30 --repeats 1

  dist:
    name: release lifecycle (gcc-14 container)
    runs-on: ubuntu-24.04
    container: gcc:14
    timeout-minutes: 45
    steps:
      - name: Bootstrap container
        run: |
          apt-get update
          apt-get install -y git ca-certificates python3 python3-venv
      - uses: actions/checkout@v4
      - name: Install dependencies and Meson (>= 1.8)
        run: |
          apt-get install -y ninja-build libgmp-dev libmpfr-dev pkg-config
          python3 -m venv /opt/meson
          /opt/meson/bin/pip install --upgrade pip "meson>=1.8"
          ln -sf /opt/meson/bin/meson /usr/local/bin/meson
          meson --version
      - name: Configure
        run: meson setup build --buildtype=release
      - name: Source distribution
        # meson dist builds and tests the extracted tarball itself.
        run: meson dist -C build
      - name: Upload source tarball
        uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: build/meson-dist/*
          if-no-files-found: error

  docs:
    name: documentation (advisory)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev libmpfr-dev pkg-config \
            clang-18 doxygen graphviz
      - name: Install Meson (>= 1.8)
        run: |
          pipx install "meson>=1.8"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version
      - name: Configure
        run: meson setup build --buildtype=release
      - name: Build documentation
        run: meson compile -C build doc
      - name: Verify documentation output
        run: test -f build/doc/html/index.html
