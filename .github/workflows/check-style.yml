name: Check Style

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install formatter
        run: sudo apt-get update && sudo apt-get install -y cmake clang-format
      - name: Check style
        run: cmake -DFPLLL_SOURCE_DIR="$GITHUB_WORKSPACE" -P cmake/CheckStyle.cmake
