name: Check Style

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-style-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Check workflow syntax
        uses: docker://rhysd/actionlint:1.7.12
      - name: Install formatting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format cmake
      - name: Check style
        run: cmake -DFPLLL_SOURCE_DIR="$GITHUB_WORKSPACE" -P cmake/CheckStyle.cmake
