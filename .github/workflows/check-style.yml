name: Check Style

on:
  push:
  pull_request:

concurrency:
  group: check-style-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up build environment
        uses: ./.github/actions/setup-fplll
      - name: Check style
        run: cmake -DFPLLL_SOURCE_DIR="$GITHUB_WORKSPACE" -P cmake/CheckStyle.cmake
