name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  source-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache g++ libgmp-dev libmpfr-dev pkg-config
      - name: Build and validate release
        run: |
          cmake --preset gcc-release -DFPLLL_MAX_PARALLEL_ENUM_DIM=20 -DFPLLL_BUILD_ISOLATION_TESTS=ON
          cmake --build --preset gcc-release
          ctest --preset gcc-release
      - name: Publish source archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" build/gcc-release/fplll-*.tar.gz --verify-tag --title "$RELEASE_TAG" --generate-notes
