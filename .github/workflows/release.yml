name: Release

on:
  push:
    tags:
      - "*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  source-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up build environment
        uses: ./.github/actions/setup-fplll
      - name: Build and validate release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          cmake --preset release -DCMAKE_CXX_COMPILER=g++ \
            -DFPLLL_VERSION="$release_version" -DFPLLL_BUILD_ISOLATION_TESTS=ON
          cmake --build --preset release
          ctest --preset release
          cmake --build --preset release --target package_source
      - name: Publish source archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" build/release/fplll-*.tar.gz --verify-tag --title "$RELEASE_TAG" --generate-notes
