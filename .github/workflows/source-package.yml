name: Source package

on:
  push:
  pull_request:

concurrency:
  group: source-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-isolation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up build environment
        uses: ./.github/actions/setup-fplll
      - name: Configure isolation test
        run: cmake --preset gcc-debug -DFPLLL_BUILD_ISOLATION_TESTS=ON
      - name: Build, test and install from the source archive
        run: ctest --preset gcc-debug -R '^test_build_isolation$'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: fplll-source
          path: build/gcc-debug/fplll-*.tar.gz
          if-no-files-found: error
