name: CMake

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: gcc-debug
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up build environment
        uses: ./.github/actions/setup-fplll
      - name: Configure, build, and test
        run: |
          cmake --preset gcc-debug
          cmake --build --preset gcc-debug
          ctest --preset gcc-debug
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

  sanitizers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-asan, gcc-ubsan]
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up build environment
        uses: ./.github/actions/setup-fplll
        with:
          scope: ${{ matrix.preset }}
      - name: Configure and build focused test targets
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET" --target fplll_cli test_nr test_lll test_enum test_cvp test_svp
      - name: Run focused sanitizer tests
        env:
          PRESET: ${{ matrix.preset }}
        run: ctest --preset "$PRESET" -R '^(test_nr|test_lll|test_enum|test_cvp|test_svp)$'
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
