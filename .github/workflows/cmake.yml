name: CMake

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: gcc-debug
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up build environment
        uses: ./.github/actions/setup-fplll
      - name: Configure, build, and test
        run: |
          cmake --preset debug -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_STANDARD=23 -DFPLLL_MAX_PARALLEL_ENUM_DIM=20
          cmake --build --preset debug
          ctest --preset debug
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

  sanitizers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: gcc-${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up build environment
        uses: ./.github/actions/setup-fplll
        with:
          scope: ${{ matrix.sanitizer }}
      - name: Configure and build focused test targets
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          cmake --preset debug -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_STANDARD=23 \
            -DFPLLL_MAX_PARALLEL_ENUM_DIM=0 \
            -DCMAKE_CXX_FLAGS="-fsanitize=$SANITIZER -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=$SANITIZER" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=$SANITIZER"
          cmake --build --preset debug --target fplll_cli test_nr test_lll test_enum test_cvp test_svp
      - name: Run focused sanitizer tests
        run: ctest --preset debug -R '^(test_nr|test_lll|test_enum|test_cvp|test_svp)$'
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
