name: Set up fplll build environment
description: Install GCC build dependencies and restore a job-scoped compiler cache
inputs:
  scope:
    description: Separate caches for matrix entries with different compiler flags
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          ccache \
          cmake \
          libgmp-dev \
          libmpfr-dev \
          libqd-dev \
          ninja-build \
          pkg-config
    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ${{ runner.os }}-${{ inputs.scope || github.job }}-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'fplll/**/*.h', 'fplll/**/*.cpp', 'fplll/**/*.inl', 'tests/**/*.cpp', 'tests/**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.scope || github.job }}-ccache-
    - name: Limit compiler cache size
      shell: bash
      run: ccache --max-size=500MiB
